<!DOCTYPE html>
<html>
<head>
  <title>Teacher Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f1f5f9; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    #loginSection { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 360px; margin: 100px auto; text-align: center; }
    #loginSection input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; }
    #loginSection button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    #loginSection button:disabled { background: #94a3b8; cursor: not-allowed; }
    #loginStatus { margin-top: 10px; font-size: 14px; min-height: 20px; }

    #dashboardSection { display: none; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    
    .flex-row { display: flex; gap: 10px; margin-bottom: 10px; }
    input[type="text"], input[type="number"], input[type="file"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button.btn { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button.btn-danger { background: #dc2626; }
    
    .alert-box { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    .sub-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    .q-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">

  <div id="loginSection">
    <h2>👨‍🏫 Teacher Login</h2>
    <input type="password" id="passkeyInput" placeholder="Enter Passkey (Default: 1234)" />
    <button id="loginBtn" onclick="loginTeacher()">Login</button>
    <div id="loginStatus"></div>
  </div>

  <div id="dashboardSection">
    <h2>Invigilator Dashboard</h2>

    <div class="card">
      <h3>🔑 Reset Passkey</h3>
      <div class="flex-row">
        <input type="password" id="oldPasskey" placeholder="Old Passkey" />
        <input type="password" id="newPasskey" placeholder="New Passkey" />
        <button class="btn" onclick="resetPasskey()">Update Passkey</button>
      </div>
      <div id="passkeyStatus"></div>
    </div>

    <div class="card">
      <h3>👤 Invigilator Face Registration</h3>
      <div class="flex-row">
        <input type="file" id="invigilatorImage" accept="image/*" />
        <button class="btn" onclick="uploadInvigilatorFace()">Upload & Register Face</button>
        <button class="btn btn-danger" onclick="clearInvigilatorFace()">Clear Registered Face</button>
      </div>
      <div id="faceStatus"></div>
    </div>

    <div class="card">
      <h3>⏱️ Exam Duration Control</h3>
      <div class="flex-row">
        <input type="number" id="timerMinutes" placeholder="Minutes (e.g., 60)" min="1" />
        <button class="btn" onclick="startExamTimer()">Start Test Timer</button>
      </div>
      <div id="timerStatus"></div>
    </div>

    <div class="card">
      <h3>📝 Question Management</h3>
      <div class="flex-row">
        <input type="text" id="questionInput" placeholder="Enter new question..." style="flex: 1;" />
        <button class="btn" onclick="addQuestion()">Add Question</button>
      </div>
      <div id="questionsList"></div>
    </div>

    <div class="card">
      <h3>🚨 Real-Time Proctoring Alerts</h3>
      <div id="notificationsList">
        <p style="color: #94a3b8; font-style: italic;">No violations detected yet.</p>
      </div>
    </div>

    <div class="card">
      <h3>📄 Student Submissions</h3>
      <div id="submissionsList">
        <p style="color: #94a3b8; font-style: italic;">No submissions yet.</p>
      </div>
    </div>
  </div>

</div>

<script>
  const socket = io();
  let modelsLoaded = false;

  async function loadModels() {
    const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    modelsLoaded = true;
  }
  loadModels();

  function loginTeacher() {
    const passkey = document.getElementById('passkeyInput').value.trim();
    const btn = document.getElementById('loginBtn');
    const status = document.getElementById('loginStatus');

    if (!passkey) {
      status.style.color = '#dc2626';
      status.textContent = "Please enter a passkey.";
      return;
    }

    btn.disabled = true;
    status.style.color = '#64748b';
    status.textContent = "Verifying...";

    socket.emit('teacher-login', passkey, (res) => {
      btn.disabled = false; // Always re-enable button on response
      if (res && res.success) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
      } else {
        status.style.color = '#dc2626';
        status.textContent = (res && res.message) || 'Invalid Passkey';
      }
    });
  }

  function resetPasskey() {
    const oldPasskey = document.getElementById('oldPasskey').value.trim();
    const newPasskey = document.getElementById('newPasskey').value.trim();
    const status = document.getElementById('passkeyStatus');

    socket.emit('teacher-reset-passkey', { oldPasskey, newPasskey }, (res) => {
      if (res && res.success) {
        status.style.color = '#16a34a';
        status.textContent = "Passkey updated successfully!";
        document.getElementById('oldPasskey').value = '';
        document.getElementById('newPasskey').value = '';
      } else {
        status.style.color = '#dc2626';
        status.textContent = res.message || "Failed to update passkey.";
      }
    });
  }

  async function uploadInvigilatorFace() {
    const fileInput = document.getElementById('invigilatorImage');
    const status = document.getElementById('faceStatus');

    if (!fileInput.files || fileInput.files.length === 0) {
      alert("Please select an image file first.");
      return;
    }
    if (!modelsLoaded) {
      status.textContent = "Face API models are still loading, please wait...";
      return;
    }

    status.style.color = '#64748b';
    status.textContent = "Processing image...";

    const img = await faceapi.bufferToImage(fileInput.files[0]);
    const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

    if (!detection) {
      status.style.color = '#dc2626';
      status.textContent = "No face detected in the uploaded image. Upload a clearer picture.";
      return;
    }

    const descriptorArray = Array.from(detection.descriptor);
    socket.emit('set-invigilator-face', descriptorArray, (res) => {
      if (res && res.success) {
        status.style.color = '#16a34a';
        status.textContent = "✅ Invigilator face registered and broadcasted to students!";
      }
    });
  }

  function clearInvigilatorFace() {
    socket.emit('clear-invigilator-face', {}, (res) => {
      document.getElementById('faceStatus').style.color = '#16a34a';
      document.getElementById('faceStatus').textContent = "Cleared registered invigilator face.";
    });
  }

  function startExamTimer() {
    const minutes = parseInt(document.getElementById('timerMinutes').value.trim());
    if (!minutes || minutes <= 0) {
      alert("Enter a valid duration in minutes.");
      return;
    }
    socket.emit('start-timer', minutes);
    document.getElementById('timerStatus').style.color = '#16a34a';
    document.getElementById('timerStatus').textContent = `Timer started for ${minutes} minutes across all student portals.`;
  }

  function addQuestion() {
    const input = document.getElementById('questionInput');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('add-question', text);
    input.value = '';
  }

  function deleteQuestion(id) {
    socket.emit('delete-question', id);
  }

  socket.on('questions-updated', (questions) => {
    const list = document.getElementById('questionsList');
    if (!questions || questions.length === 0) {
      list.innerHTML = '<p style="color:#94a3b8; font-style:italic;">No questions added yet.</p>';
      return;
    }
    list.innerHTML = questions.map((q, i) => `
      <div class="q-item">
        <span><strong>Q${i+1}:</strong> ${q.text}</span>
        <button class="btn btn-danger" onclick="deleteQuestion('${q._id}')">Delete</button>
      </div>
    `).join('');
  });

  socket.on('teacher-notification', (alertData) => {
    const list = document.getElementById('notificationsList');
    if (list.querySelector('p')) list.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'alert-box';
    div.innerHTML = `<strong>⚠️ Violation Detected!</strong><br>Student: ${alertData.student} (Reg: ${alertData.regNo})<br>Action: ${alertData.violation}<br><small>Timestamp: ${alertData.time}</small>`;
    list.prepend(div);
  });

  socket.on('submissions-updated', (submissions) => {
    const list = document.getElementById('submissionsList');
    if (!submissions || submissions.length === 0) {
      list.innerHTML = '<p style="color:#94a3b8; font-style:italic;">No submissions yet.</p>';
      return;
    }
    list.innerHTML = submissions.map(s => `
      <div class="sub-box">
        <strong>🎓 ${s.student} (Reg: ${s.regNo})</strong> <small>Submitted at ${s.submittedAt}</small>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin:8px 0;">
        ${s.answers.map(a => `<p><strong>Q:</strong> ${a.questionText}<br><strong>A:</strong> ${a.answerText || '<i>No answer</i>'}</p>`).join('')}
      </div>
    `).join('');
  });
</script>

</body>
</html>
