<!DOCTYPE html>
<html>
<head>
  <title>Student Exam Screen</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #334155);
      padding: 20px 0;
    }

    #loginScreen {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 360px;
      text-align: center;
    }
    #loginScreen h2 { margin-top: 0; color: #1e293b; }
    #loginScreen input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    #loginScreen button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #loginScreen button:hover { background: #1d4ed8; }

    #examScreen {
      display: none;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 650px;
      max-width: 90vw;
    }
    #examScreen h2 { margin-top: 0; color: #1e293b; text-align: center; }
    .student-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }
    .warning {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .qa-block {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
    }
    .qa-block .q-text { font-weight: 600; color: #1e293b; margin-bottom: 8px; }
    .qa-block textarea {
      width: 100%;
      height: 80px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
    }
    .no-questions { color: #94a3b8; font-size: 14px; font-style: italic; }

    #submitBtn {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    #submitBtn:hover { background: #15803d; }
    #submitStatus { text-align: center; margin-top: 10px; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>

  <div id="loginScreen">
    <h2>🎓 Exam Login</h2>
    <input type="text" id="nameInput" placeholder="Full Name" />
    <input type="text" id="regInput" placeholder="Register Number" />
    <button onclick="startExam()">Start Exam</button>
  </div>

  <div id="examScreen">
    <h2>Online Examination Portal</h2>
    <div class="student-badge">
      <span id="badgeName"></span>
      <span id="badgeReg"></span>
    </div>
    <div class="warning">⚠️ Copying text or switching tabs triggers an automatic alert!</div>

    <div id="questionArea">
      <p class="no-questions">Waiting for teacher to post questions...</p>
    </div>

    <button id="submitBtn" onclick="submitAnswers()">Submit Answers</button>
    <div id="submitStatus"></div>
  </div>

  <script>
    const socket = io();
    let studentName = "";
    let studentReg = "";
    let currentQuestions = [];
    let alreadySubmitted = false;

    function startExam() {
      const name = document.getElementById('nameInput').value.trim();
      const reg = document.getElementById('regInput').value.trim();

      if (!name || !reg) {
        alert("Please enter both Name and Register Number.");
        return;
      }

      studentName = name;
      studentReg = reg;

      document.getElementById('badgeName').textContent = "👤 " + studentName;
      document.getElementById('badgeReg').textContent = "🆔 " + studentReg;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('examScreen').style.display = 'block';

      renderQuestions();
    }

    function sendAlert(type) {
      if (!studentName) return;
      socket.emit('student-alert', {
        student: studentName,
        regNo: studentReg,
        violation: type,
        time: new Date().toLocaleTimeString()
      });
    }

    document.addEventListener('copy', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Copy Action");
      alert("Copying text is prohibited during exams!");
    });

    document.addEventListener('paste', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Paste Action");
      alert("Pasting text is prohibited during exams!");
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && studentName) {
        sendAlert("Switched Tab / Window");
      }
    });

    socket.on('questions-updated', (questions) => {
      currentQuestions = questions;
      if (studentName) renderQuestions();
    });

    function renderQuestions() {
      const area = document.getElementById('questionArea');
      if (!currentQuestions || currentQuestions.length === 0) {
        area.innerHTML = '<p class="no-questions">Waiting for teacher to post questions...</p>';
        return;
      }
      area.innerHTML = currentQuestions.map((q, i) => `
        <div class="qa-block">
          <div class="q-text">Q${i + 1}. ${q.text}</div>
          <textarea id="answer-${q._id}" placeholder="Type your answer here..."></textarea>
        </div>
      `).join('');
    }

    function submitAnswers() {
      if (alreadySubmitted) {
        alert("You have already submitted your answers.");
        return;
      }
      if (!currentQuestions || currentQuestions.length === 0) {
        alert("No questions to answer yet.");
        return;
      }

      const answers = currentQuestions.map(q => ({
        questionId: q._id,
        questionText: q.text,
        answerText: document.getElementById('answer-' + q._id).value.trim()
      }));

      socket.emit('submit-answers', {
        student: studentName,
        regNo: studentReg,
        answers: answers
      }, (res) => {
        const statusEl = document.getElementById('submitStatus');
        if (res && res.success) {
          alreadySubmitted = true;
          statusEl.style.color = '#16a34a';
          statusEl.textContent = "✅ Answers submitted successfully!";
          document.getElementById('submitBtn').disabled = true;
          document.getElementById('submitBtn').style.opacity = '0.6';
        } else {
          statusEl.style.color = '#dc2626';
          statusEl.textContent = "❌ Submission failed. Try again.";
        }
      });
    }
  </script>
</body>
</html>
