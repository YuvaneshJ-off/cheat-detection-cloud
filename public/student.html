<!DOCTYPE html>
<html>
<head>
  <title>Student Exam Screen</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #334155);
    }

    /* Login Screen */
    #loginScreen {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 360px;
      text-align: center;
    }
    #loginScreen h2 { margin-top: 0; color: #1e293b; }
    #loginScreen input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    #loginScreen button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    #loginScreen button:hover { background: #1d4ed8; }

    /* Exam Screen */
    #examScreen {
      display: none;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 650px;
      max-width: 90vw;
    }
    #examScreen h2 { margin-top: 0; color: #1e293b; text-align: center; }
    .student-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }
    .warning {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    #questionBox {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
      max-height: 260px;
      overflow-y: auto;
    }
    #questionBox h4 { margin: 0 0 10px 0; color: #1e293b; }
    .question-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #334155;
    }
    .no-questions { color: #94a3b8; font-size: 14px; font-style: italic; }

    textarea {
      width: 100%;
      height: 180px;
      font-size: 15px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      resize: vertical;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <h2>🎓 Exam Login</h2>
    <input type="text" id="nameInput" placeholder="Full Name" />
    <input type="text" id="regInput" placeholder="Register Number" />
    <button onclick="startExam()">Start Exam</button>
  </div>

  <!-- Exam Screen -->
  <div id="examScreen">
    <h2>Online Examination Portal</h2>
    <div class="student-badge">
      <span id="badgeName"></span>
      <span id="badgeReg"></span>
    </div>
    <div class="warning">⚠️ Copying text or switching tabs triggers an automatic alert!</div>

    <div id="questionBox">
      <h4>📋 Questions</h4>
      <div id="questionList"><p class="no-questions">Waiting for teacher to post questions...</p></div>
    </div>

    <textarea id="answerBox" placeholder="Type your answers here..."></textarea>
  </div>

  <script>
    const socket = io();
    let studentName = "";
    let studentReg = "";

    function startExam() {
      const name = document.getElementById('nameInput').value.trim();
      const reg = document.getElementById('regInput').value.trim();

      if (!name || !reg) {
        alert("Please enter both Name and Register Number.");
        return;
      }

      studentName = name;
      studentReg = reg;

      document.getElementById('badgeName').textContent = "👤 " + studentName;
      document.getElementById('badgeReg').textContent = "🆔 " + studentReg;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('examScreen').style.display = 'block';
    }

    function sendAlert(type) {
      if (!studentName) return;
      socket.emit('student-alert', {
        student: studentName,
        regNo: studentReg,
        violation: type,
        time: new Date().toLocaleTimeString()
      });
    }

    document.addEventListener('copy', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Copy Action");
      alert("Copying text is prohibited during exams!");
    });

    document.addEventListener('paste', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Paste Action");
      alert("Pasting text is prohibited during exams!");
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && studentName) {
        sendAlert("Switched Tab / Window");
      }
    });

    // Receive live questions from the teacher
    socket.on('questions-updated', (questions) => {
      const list = document.getElementById('questionList');
      if (!questions || questions.length === 0) {
        list.innerHTML = '<p class="no-questions">Waiting for teacher to post questions...</p>';
        return;
      }
      list.innerHTML = questions.map((q, i) => `
        <div class="question-item"><strong>Q${i + 1}.</strong> ${q.text}</div>
      `).join('');
    });
  </script>
</body>
</html>
