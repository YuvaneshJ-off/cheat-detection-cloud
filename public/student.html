<!DOCTYPE html>
<html>
<head>
  <title>Student Exam Screen</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #334155);
      padding: 20px 0;
    }
    #loginScreen {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 360px;
      text-align: center;
    }
    #loginScreen h2 { margin-top: 0; color: #1e293b; }
    #loginScreen input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    #loginScreen button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #loginScreen button:hover { background: #1d4ed8; }
    #loginScreen button:disabled { background: #94a3b8; cursor: not-allowed; }
    #loginStatus { font-size: 13px; color: #64748b; margin-top: 8px; min-height: 18px; }

    #examScreen {
      display: none;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 650px;
      max-width: 90vw;
    }
    #examScreen h2 { margin-top: 0; color: #1e293b; text-align: center; }
    .student-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }
    .timer-badge {
      display: none;
      background: #fef2f2;
      border: 2px solid #ef4444;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
    }
    .warning {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .qa-block {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
    }
    .qa-block .q-text { font-weight: 600; color: #1e293b; margin-bottom: 8px; }
    .qa-block textarea {
      width: 100%;
      height: 80px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
    }
    .no-questions { color: #94a3b8; font-size: 14px; font-style: italic; }

    #submitBtn {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    #submitBtn:hover { background: #15803d; }
    #submitStatus { text-align: center; margin-top: 10px; font-size: 14px; min-height: 20px; }

    #cameraWarningPopup {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626;
      color: white;
      padding: 14px 26px;
      border-radius: 8px;
      z-index: 9999;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <h2>🎓 Exam Login</h2>
    <input type="text" id="nameInput" placeholder="Full Name" />
    <input type="text" id="regInput" placeholder="Register Number" />
    <button id="startExamBtn" onclick="startExam()">Start Exam</button>
    <div id="loginStatus"></div>
  </div>

  <div id="examScreen">
    <h2>Online Examination Portal</h2>
    <div class="student-badge">
      <span id="badgeName"></span>
      <span id="badgeReg"></span>
    </div>
    
    <div id="examTimer" class="timer-badge">
      ⏱️ Time Remaining: <span id="timerDisplay">--:--</span>
    </div>

    <div class="warning">⚠️ Copying, pasting, cutting, right-clicking, switching tabs, exiting fullscreen, or leaving camera view triggers instant alerts!</div>

    <div id="questionArea">
      <p class="no-questions">Waiting for teacher to post questions...</p>
    </div>

    <button id="submitBtn" onclick="submitAnswers()">Submit Answers</button>
    <div id="submitStatus"></div>
  </div>

  <video id="monitorVideo" autoplay muted playsinline style="display:none; width:1px; height:1px;"></video>
  <div id="cameraWarningPopup"></div>

  <script>
    const socket = io();
    let studentName = "";
    let studentReg = "";
    let currentQuestions = [];
    let alreadySubmitted = false;

    // ====== Camera Monitoring State ======
    let cameraStream = null;
    let faceCheckInterval = null;
    let noFaceStartTime = null;
    const NO_FACE_THRESHOLD_SECONDS = 15;
    const FACE_CHECK_INTERVAL_MS = 1500;

    // ====== Timer State ======
    let timerInterval = null;
    let totalTimeSeconds = 0;

    async function startExam() {
      const name = document.getElementById('nameInput').value.trim();
      const reg = document.getElementById('regInput').value.trim();

      if (!name || !reg) {
        alert("Please enter both Name and Register Number.");
        return;
      }

      const startBtn = document.getElementById('startExamBtn');
      const loginStatus = document.getElementById('loginStatus');
      startBtn.disabled = true;
      loginStatus.textContent = "Requesting camera access...";

      try {
        await initCameraMonitoring();
      } catch (err) {
        console.error("Camera/AI Init Error:", err);
        loginStatus.style.color = '#dc2626';
        loginStatus.textContent = "⚠️ Camera access denied or failed — reported to teacher.";
        studentName = name;
        studentReg = reg;
        sendAlert("Camera Permission Denied or Failed");
        await new Promise(r => setTimeout(r, 2000));
      }

      studentName = name;
      studentReg = reg;

      document.getElementById('badgeName').textContent = "👤 " + studentName;
      document.getElementById('badgeReg').textContent = "🆔 " + studentReg;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('examScreen').style.display = 'block';

      renderQuestions();
      enterFullscreen();
    }

    // ====== Camera & AI Monitoring ======
    async function initCameraMonitoring() {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video = document.getElementById('monitorVideo');
      video.srcObject = cameraStream;
      await video.play();

      await faceapi.nets.tinyFaceDetector.loadFromUri(
        'https://vladmandic.github.io/face-api/model/'
      );

      startFaceDetectionLoop(video);
    }

    function startFaceDetectionLoop(video) {
      faceCheckInterval = setInterval(async () => {
        if (alreadySubmitted) return;

        let detections;
        try {
          detections = await faceapi.detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions()
          );
        } catch (e) {
          return;
        }

        if (detections.length === 0) {
          if (!noFaceStartTime) noFaceStartTime = Date.now();
          const elapsedSeconds = (Date.now() - noFaceStartTime) / 1000;
          if (elapsedSeconds >= NO_FACE_THRESHOLD_SECONDS) {
            showCameraWarningPopup("⚠️ You have not been visible for 15+ seconds. Stay in frame!");
            sendAlert("Camera: Face Not Detected 15s+");
            noFaceStartTime = Date.now(); // Resets timer so it alerts every 15s continuously
          }
        } else if (detections.length > 1) {
          sendAlert("Camera: Multiple Faces Detected (" + detections.length + ")");
          noFaceStartTime = null;
        } else {
          noFaceStartTime = null;
        }
      }, FACE_CHECK_INTERVAL_MS);
    }

    function stopCameraMonitoring() {
      if (faceCheckInterval) {
        clearInterval(faceCheckInterval);
        faceCheckInterval = null;
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function showCameraWarningPopup(message) {
      const popup = document.getElementById('cameraWarningPopup');
      popup.textContent = message;
      popup.style.display = 'block';
      clearTimeout(window.__cameraPopupTimeout);
      window.__cameraPopupTimeout = setTimeout(() => {
        popup.style.display = 'none';
      }, 5000);
    }

    // ====== Countdown Timer Logic ======
    function startCountdownTimer(minutes) {
      if (!minutes || minutes <= 0 || timerInterval) return;

      totalTimeSeconds = minutes * 60;
      const timerContainer = document.getElementById('examTimer');
      timerContainer.style.display = 'block';
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        if (alreadySubmitted) {
          clearInterval(timerInterval);
          return;
        }

        totalTimeSeconds--;
        updateTimerDisplay();

        if (totalTimeSeconds <= 0) {
          clearInterval(timerInterval);
          alert("⏰ Time is up! Submitting your exam automatically.");
          submitAnswers();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(totalTimeSeconds / 60);
      const secs = totalTimeSeconds % 60;
      document.getElementById('timerDisplay').textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // ====== Fullscreen Enforcement ======
    function enterFullscreen() {
      const el = document.documentElement;
      const request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (request) {
        request.call(el).catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const inFullscreen = !!document.fullscreenElement;
      if (!inFullscreen && studentName && !alreadySubmitted) {
        sendAlert("Exited Fullscreen Mode");
      }
    });

    function sendAlert(type) {
      if (!studentName) return;
      socket.emit('student-alert', {
        student: studentName,
        regNo: studentReg,
        violation: type,
        time: new Date().toLocaleTimeString()
      });
    }

    // ====== Event Blockers ======
    document.addEventListener('copy', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Copy Action");
      alert("Copying text is prohibited during exams!");
    });

    document.addEventListener('paste', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Paste Action");
      alert("Pasting text is prohibited during exams!");
    });

    document.addEventListener('cut', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Cut Action");
      alert("Cutting text is prohibited during exams!");
    });

    document.addEventListener('contextmenu', (e) => {
      if (!studentName) return;
      e.preventDefault();
      sendAlert("Attempted Right-Click");
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && studentName) {
        sendAlert("Switched Tab / Window");
      }
    });

    window.addEventListener('blur', () => {
      if (studentName && !alreadySubmitted) {
        sendAlert("Lost Window Focus");
      }
    });

    // ====== Questions & Timer Event Handler ======
    socket.on('questions-updated', (data) => {
      if (Array.isArray(data)) {
        currentQuestions = data;
      } else if (data && data.questions) {
        currentQuestions = data.questions;
        if (data.durationMinutes) {
          startCountdownTimer(data.durationMinutes);
        }
      }
      if (studentName) renderQuestions();
    });

    socket.on('start-timer', (durationMinutes) => {
      startCountdownTimer(durationMinutes);
    });

    function renderQuestions() {
      const area = document.getElementById('questionArea');
      if (!currentQuestions || currentQuestions.length === 0) {
        area.innerHTML = '<p class="no-questions">Waiting for teacher to post questions...</p>';
        return;
      }
      area.innerHTML = currentQuestions.map((q, i) => `
        <div class="qa-block">
          <div class="q-text">Q${i + 1}. ${q.text}</div>
          <textarea id="answer-${q._id}" placeholder="Type your answer here..."></textarea>
        </div>
      `).join('');
    }

    function submitAnswers() {
      if (alreadySubmitted) return;
      if (!currentQuestions || currentQuestions.length === 0) {
        alert("No questions to answer yet.");
        return;
      }

      const answers = currentQuestions.map(q => ({
        questionId: q._id,
        questionText: q.text,
        answerText: (document.getElementById('answer-' + q._id) ? document.getElementById('answer-' + q._id).value.trim() : "")
      }));

      socket.emit('submit-answers', {
        student: studentName,
        regNo: studentReg,
        answers: answers
      }, (res) => {
        const statusEl = document.getElementById('submitStatus');
        if (res && res.success) {
          alreadySubmitted = true;
          if (timerInterval) clearInterval(timerInterval);
          stopCameraMonitoring();
          statusEl.style.color = '#16a34a';
          statusEl.textContent = "✅ Answers submitted successfully!";
          document.getElementById('submitBtn').disabled = true;
          document.getElementById('submitBtn').style.opacity = '0.6';
        } else {
          statusEl.style.color = '#dc2626';
          statusEl.textContent = "❌ Submission failed. Try again.";
        }
      });
    }
  </script>
</body>
</html>
